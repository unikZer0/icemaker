<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ · IceMaker</title><link rel="stylesheet" href="/style.css"><script defer src="/login.js"></script></head><body class="login-page"><section class="panel login-card"><a class="login-brand" href="/">❄ IceMaker</a><div class="eyebrow">ระบบจัดการเครื่องทำน้ำแข็ง</div><h1>ยินดีต้อนรับ</h1><p>เข้าสู่ระบบเพื่อจัดการเครื่องทำน้ำแข็งและดูค่าที่วัดได้</p><form id="login-form"><label>ชื่อผู้ใช้<input id="username" autocomplete="username" required></label><label>รหัสผ่าน<input id="password" type="password" autocomplete="current-password" required></label><p id="error" role="alert"></p><button type="submit" id="submit" class="primary">เข้าสู่ระบบ</button></form><p class="help">ใช้ชื่อผู้ใช้และรหัสผ่านจาก ADMIN_USER และ ADMIN_PASSWORD ในไฟล์ .env ของเซิร์ฟเวอร์</p></section></body></html>
